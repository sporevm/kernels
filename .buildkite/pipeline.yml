steps:
  - label: ":penguin: Build SporeVM arm64 kernel"
    key: build-sporevm
    command: "scripts/ci-build-kernel-asset.sh"
    artifact_paths: "dist/kernels/*"
    timeout_in_minutes: 45
    cache:
      paths:
        - ".kernel-cache/arm64/"
      key: "v2-sporevm-kernel-arm64-6.1.191"
    agents:
      queue: hosted

  - label: ":penguin: Build SporeVM x86_64 kernel"
    key: build-sporevm-x86-64
    command: "SPOREVM_KERNEL_ARCH=x86_64 scripts/ci-build-kernel-asset.sh dist/x86_64-build"
    artifact_paths: "dist/x86_64-build/*"
    timeout_in_minutes: 45
    cache:
      paths:
        - ".kernel-cache/x86_64/"
      key: "v1-sporevm-kernel-x86_64-6.1.191"
    agents:
      queue: hosted

  - label: ":package: Stage approved SporeVM x86_64 kernel"
    key: stage-approved-x86-64
    command: "scripts/ci-stage-approved-x86-kernel.sh"
    artifact_paths: "dist/kernels/*"
    agents:
      queue: hosted

  - wait

  - label: ":rocket: Publish release"
    command: |
      if [[ -z "$${BUILDKITE_TAG:-}" ]]; then
        echo "Skipping release publish because this is not a tagged build"
        exit 0
      fi
      scripts/ci-publish-release.sh
    agents:
      queue: hosted
