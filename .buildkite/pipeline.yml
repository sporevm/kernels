steps:
  - label: ":test_tube: Native ARM64 Linux {{matrix}}"
    command: "bash scripts/ci-native-kernel-validation.sh arm64 {{matrix}}"
    matrix: ["6.1.155", "6.1.191"]
    artifact_paths: "dist/native-validation/**/*"
    timeout_in_minutes: 45
    plugins: &mise_plugins
      - mise#e53a95a05d51dd20b1bfcd98fb3f9fe13292812b:
          version: "2026.5.12"
    agents:
      queue: sporevm-linux-arm64

  - label: ":test_tube: Native x86_64 Linux {{matrix}}"
    command: "bash scripts/ci-native-kernel-validation.sh x86_64 {{matrix}}"
    matrix: ["6.1.155", "6.1.191"]
    artifact_paths: "dist/native-validation/**/*"
    timeout_in_minutes: 45
    plugins: *mise_plugins
    agents:
      queue: sporevm-linux-amd64
